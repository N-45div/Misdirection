name: tools-tests

on:
  push:
    paths: ["tools/**", "Assets/**", "Packages/**", "ProjectSettings/ProjectVersion.txt", ".github/workflows/tools-tests.yml"]
  pull_request:
    paths: ["tools/**", "Assets/**", "Packages/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mono (runs the game's C# scoring for the parity test)
        run: sudo apt-get update -q && sudo apt-get install -y -q mono-devel
      - name: Analysis tests (CSV contract + C#/Python parity)
        run: python -m unittest discover -s tools/tests -t . -v
      - name: Shell syntax
        run: for f in tools/*.sh; do bash -n "$f"; done

  unity-compile:
    # Compiles every script against the real Unity editor and Meta XR SDK v207 (no Unity licence needed).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
      - uses: actions/checkout@v4
      - name: Compile check in unityci/editor
        run: |
          VERSION=$(grep -E '^m_EditorVersion:' ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          docker run --rm -v "$PWD:/project" -w /project "unityci/editor:ubuntu-${VERSION}-android-3.2.2" bash -c \
            "apt-get update -qq && apt-get install -y -qq python3 >/dev/null && python3 tools/unity_compile_check.py --unity /opt/unity/Editor --cache /tmp/ucheck"
